<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLB Studio | かんたん編集</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#17233a;font:15px system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:white;border-bottom:1px solid #e0e5ed;padding:14px 22px}header strong{font-size:19px;margin-right:auto}button,.upload{border:1px solid #cbd5e1;border-radius:10px;background:white;padding:10px 14px;font:inherit;cursor:pointer;color:inherit}button:disabled{opacity:.45;cursor:default}.primary{background:#2563eb;border-color:#2563eb;color:white}input[type=file]{display:none}.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 270px;min-height:calc(100dvh - 72px)}aside{padding:20px;background:white}select#category,select#templates{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:white;color:#17233a;font:inherit}aside:first-child{border-right:1px solid #e0e5ed}aside:last-child{border-left:1px solid #e0e5ed}h2{font-size:15px;margin:0 0 15px}p{color:#64748b;line-height:1.6;font-size:13px}.viewport{position:relative;min-height:420px}canvas{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;bottom:15px;left:15px;right:15px;text-align:center;pointer-events:none;color:#64748b;font-size:12px}.part{display:block;width:100%;text-align:left;margin:6px 0;overflow-wrap:anywhere}.part.active{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}.field{margin:20px 0}label{display:block;font-weight:600;margin-bottom:8px}input[type=color]{width:100%;height:44px;border:1px solid #cbd5e1;border-radius:9px;padding:4px;background:white}input[type=range]{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.note{font-size:12px;color:#64748b}#status{margin-top:20px;white-space:pre-wrap}a{color:#2563eb}@media(max-width:800px){.layout{display:flex;flex-direction:column}.viewport{order:0;height:52dvh;min-height:320px}aside:first-child{order:1;border:0;border-top:1px solid #e0e5ed}aside:last-child{order:2;border:0;border-top:1px solid #e0e5ed}header{padding:12px}header strong{width:100%}}
</style></head><body>
<header><strong>GLB Studio <small style="font-size:12px;color:#64748b">かんたん編集</small></strong><label class="upload" for="file" style="margin:0">GLBを開く</label><input id="file" type="file" accept=".glb,model/gltf-binary"><button id="save" class="primary">GLBを保存</button></header>
<div class="layout"><aside><h2>テンプレートから始める</h2><label for="category">カテゴリ</label><select id="category" aria-label="カテゴリを選択"></select><label for="templates" style="margin-top:14px">テンプレート</label><select id="templates" aria-label="テンプレートを選択"><option value="">テンプレートを選択してください</option></select><p>テンプレートを選ぶと現在のモデルが置き換わります。</p><hr style="border:0;border-top:1px solid #e2e8f0;margin:20px 0"><h2>パーツ一覧</h2><div id="parts"></div><p>パーツをクリックして選択できます。分割されていないGLBは、モデル全体を編集できます。</p><a href="./model-editor.html">高機能エディタを開く →</a></aside>
<main class="viewport"><canvas id="view"></canvas><div class="hint">ドラッグで回転・ピンチやホイールで拡大縮小</div></main>
<aside><h2>かんたん編集</h2><div id="selected">GLBを読み込んでください</div><div class="field"><label for="color">色</label><input id="color" type="color" value="#6699cc" disabled></div><div class="field"><div class="row"><label for="size">サイズ</label><output id="sizeValue">100%</output></div><input id="size" type="range" min="25" max="200" value="100" step="5" disabled><p class="note">選択パーツを縦横奥行き同じ倍率で変更します。</p></div><button id="reset" disabled>選択パーツを元に戻す</button><p id="status" role="status">GLBファイルを選択してください。</p></aside></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
const $=id=>document.getElementById(id),canvas=$('view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#edf2f9');
const camera=new THREE.PerspectiveCamera(45,1,.01,100000);camera.position.set(3,2,5);
scene.add(new THREE.HemisphereLight(0xffffff,0x718096,2.5));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(4,8,5);scene.add(sun);
const orbit=new OrbitControls(camera,canvas);orbit.enableDamping=true;
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
let root=new THREE.Group(),selected=null,parts=[],originals=new Map(),sourceName='model';scene.add(root);
const status=t=>$('status').textContent=t;
function getMeshes(){const m=[];root.traverse(o=>{if(o.isMesh)m.push(o)});return m}
function loadTemplate(name,build){
 const group=new THREE.Group();build(group);
 scene.remove(root);root=group;root.name=name;scene.add(root);sourceName=name;
 const meshes=getMeshes();parts=meshes.length>1?meshes:[root];
 originals=new Map(parts.map(o=>[o,{scale:o.scale.clone(),material:o.isMesh?(Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material?.clone()):null}]));
 setSelection(null);frame();status(name+' テンプレートを読み込みました。パーツを選んで色・サイズを変更できます。');
}
const material=(color)=>new THREE.MeshStandardMaterial({color,roughness:.7,metalness:0});
function add(g,name,geo,color,x=0,y=0,z=0){const m=new THREE.Mesh(geo,material(color));m.name=name;m.position.set(x,y,z);g.add(m);return m}
const box=(x,y,z)=>new THREE.BoxGeometry(x,y,z);
const cylinder=(r,h)=>new THREE.CylinderGeometry(r,r,h,32);
function hollowCup(radius,height,thickness){const pts=[new THREE.Vector2(0,0),new THREE.Vector2(radius,0),new THREE.Vector2(radius,height),new THREE.Vector2(radius-thickness,height),new THREE.Vector2(radius-thickness,thickness),new THREE.Vector2(0,thickness)];return new THREE.LatheGeometry(pts,64)}
function curvedHook(){const points=[new THREE.Vector3(0,.95,.15),new THREE.Vector3(0,.75,.4),new THREE.Vector3(0,.4,.68),new THREE.Vector3(0,.2,.8),new THREE.Vector3(0,.23,1.05),new THREE.Vector3(0,.42,1.14)];return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points),48,.11,12,false)}
const templates=[
 ['cube','立方体','基本図形',g=>add(g,'立方体',box(1,1,1),0x60a5fa)],
 ['cylinder','円柱','基本図形',g=>add(g,'円柱',cylinder(.5,1),0x60a5fa)],
 ['sphere','球体','基本図形',g=>add(g,'球体',new THREE.SphereGeometry(.6,32,24),0x60a5fa)],
 ['phone-stand','スマホスタンド','台座・背もたれ',g=>{add(g,'台座',box(1.6,.15,1.15),0x334155,0,.075,0);const back=add(g,'背もたれ',box(1.5,1.25,.13),0x64748b,0,.72,-.4);back.rotation.x=-.22;add(g,'前ストッパー',box(1.5,.22,.14),0x334155,0,.22,.47)}],
 ['hook','壁掛けフック','本体・フック',g=>{add(g,'取り付け本体',box(1.1,1.5,.22),0x64748b,0,.75,0);add(g,'曲線フック',curvedHook(),0x2563eb)}],
 ['tray','小物トレー','底・側面',g=>{add(g,'底板',box(2,.12,1.4),0x94a3b8,0,.06,0);for(const [n,x,z,w,d] of [['前',0,.65,2,.1],['後',0,-.65,2,.1],['左',-.95,0,.1,1.3],['右',.95,0,.1,1.3]])add(g,n+'側面',box(w,.5,d),0x64748b,x,.3,z)}],
 ['cable','ケーブルホルダー','台座・仕切り',g=>{add(g,'台座',box(1.8,.15,.65),0x475569,0,.075,0);for(let i=0;i<4;i++)add(g,'仕切り'+(i+1),box(.12,.48,.65),0x60a5fa,-.78+i*.52,.32,0)}],
 ['bracket','L字ブラケット','底板・縦板',g=>{add(g,'底板',box(1.5,.18,.9),0x64748b,0,.09,0);add(g,'縦板',box(1.5,1.1,.18),0x64748b,0,.64,-.36)}],
 ['pen','ペン立て','底・壁',g=>{add(g,'底板',new THREE.CylinderGeometry(.62,.62,.12,64),0x2563eb,0,.06,0);add(g,'側壁',new THREE.CylinderGeometry(.62,.62,1.28,64,1,true),0x60a5fa,0,.76,0);add(g,'内側の壁',new THREE.CylinderGeometry(.50,.50,1.28,64,1,true),0x60a5fa,0,.76,0);add(g,'上端リング',new THREE.LatheGeometry([new THREE.Vector2(.50,0),new THREE.Vector2(.62,0)],64),0x60a5fa,0,1.4,0)}]
];
// カテゴリ定義とテンプレートIDの対応を分離し、今後の追加を簡単にする
const categories=[
 {id:'basic',name:'基本図形'},
 {id:'gadget',name:'スマホ・ガジェット'},
 {id:'storage',name:'収納・整理'},
 {id:'diy',name:'DIY・工具'}
];
const templateCategories={
 cube:'basic',cylinder:'basic',sphere:'basic',
 'phone-stand':'gadget',cable:'gadget',
 tray:'storage',pen:'storage',
 hook:'diy',bracket:'diy'
};
const templateMap=new Map(templates.map(t=>[t[0],t]));
for(const category of categories){
 const option=document.createElement('option');
 option.value=category.id;option.textContent=category.name;
 $('category').append(option);
}
function refreshTemplateOptions(){
 const current=$('templates').value;
 $('templates').replaceChildren();
 const placeholder=document.createElement('option');
 placeholder.value='';placeholder.textContent='テンプレートを選択してください';
 $('templates').append(placeholder);
 for(const [id,name,description] of templates){
  if(templateCategories[id]!==$('category').value)continue;
  const option=document.createElement('option');
  option.value=id;option.textContent=name+'（'+description+'）';
  $('templates').append(option);
 }
 $('templates').value=templateCategories[current]===$('category').value?current:'';
}
$('category').addEventListener('change',refreshTemplateOptions);
$('templates').addEventListener('change',e=>{
 const item=templateMap.get(e.target.value);
 if(item)loadTemplate(item[0],item[3]);
});
refreshTemplateOptions();
function setSelection(obj){selected=obj;$('selected').textContent=obj?(obj.name||'モデル全体'):'未選択';$('color').disabled=!obj;$('size').disabled=!obj;$('reset').disabled=!obj;
if(obj){const mat=obj.isMesh?(Array.isArray(obj.material)?obj.material[0]:obj.material):null;$('color').disabled=!mat?.color;if(mat?.color)$('color').value='#'+mat.color.getHexString();const orig=originals.get(obj);$('size').value=orig?Math.round(obj.scale.x/orig.scale.x*100):100;$('sizeValue').textContent=$('size').value+'%';}renderParts()}
function renderParts(){const list=$('parts');list.replaceChildren();parts.forEach((obj,i)=>{const b=document.createElement('button');b.className='part'+(obj===selected?' active':'');b.textContent=obj.name||'パーツ '+(i+1);b.onclick=()=>setSelection(obj);list.append(b)})}
function frame(){const box=new THREE.Box3().setFromObject(root);if(box.isEmpty())return;const center=box.getCenter(new THREE.Vector3()),radius=Math.max(box.getSize(new THREE.Vector3()).length(),.01);orbit.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(radius*.75,radius*.5,radius));camera.near=Math.max(radius/10000,.0001);camera.far=Math.max(radius*100,100);camera.updateProjectionMatrix();orbit.update()}
$('file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(!file.name.toLowerCase().endsWith('.glb')){status('GLB形式のファイルを選択してください。');return}status('読み込み中…');try{const gltf=await new GLTFLoader().parseAsync(await file.arrayBuffer(),'');scene.remove(root);root=new THREE.Group();root.add(gltf.scene);scene.add(root);sourceName=file.name.replace(/\.glb$/i,'');const meshes=getMeshes();parts=meshes.length>1?meshes:[gltf.scene];originals=new Map(parts.map(o=>[o,{scale:o.scale.clone(),material:o.isMesh?(Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material?.clone()):null}]));setSelection(null);frame();renderParts();status(file.name+' を読み込みました。'+(meshes.length===1?' 単一パーツのため全体編集になります。':''))}catch(err){status('読み込みに失敗しました: '+err.message)}};
$('color').oninput=e=>{if(!selected?.isMesh)return;const materials=Array.isArray(selected.material)?selected.material:[selected.material];selected.material=Array.isArray(selected.material)?materials.map(m=>m.clone()):materials[0].clone();for(const m of (Array.isArray(selected.material)?selected.material:[selected.material])){if(m?.color){m.color.set(e.target.value);m.needsUpdate=true}}};
$('size').oninput=e=>{if(!selected)return;const base=originals.get(selected);if(!base)return;selected.scale.copy(base.scale).multiplyScalar(Number(e.target.value)/100);$('sizeValue').textContent=e.target.value+'%'};
$('reset').onclick=()=>{if(!selected)return;const base=originals.get(selected);selected.scale.copy(base.scale);if(selected.isMesh&&base.material){selected.material=Array.isArray(base.material)?base.material.map(m=>m.clone()):base.material.clone()}setSelection(selected)};
let down=null;canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>7){down=null;return}down=null;const rect=canvas.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(getMeshes(),false)[0];if(hit)setSelection(parts.length===1?parts[0]:hit.object)});
$('save').onclick=async()=>{if(!getMeshes().length){status('先にGLBを読み込んでください。');return}status('GLBを書き出しています…');try{const data=await new GLTFExporter().parseAsync(root,{binary:true});const url=URL.createObjectURL(new Blob([data],{type:'model/gltf-binary'}));const a=document.createElement('a');a.href=url;a.download=sourceName+'-edited.glb';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);status('GLBを保存しました。')}catch(err){status('保存に失敗しました: '+err.message)}};
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(canvas);function animate(){requestAnimationFrame(animate);orbit.update();renderer.render(scene,camera)}animate();
</script></body></html>
