<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLB Studio | ブラウザ3Dエディタ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#e5eaf2;font:14px system-ui,-apple-system,sans-serif}header{height:60px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid #354257}header strong{font-size:19px;margin-right:auto}
button,.file-label{background:#24344b;border:1px solid #43546b;border-radius:8px;color:white;padding:9px 12px;cursor:pointer;font:inherit}button:hover,.file-label:hover{background:#365071}.primary{background:#2463e5;border-color:#2463e5}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;height:calc(100vh - 60px)}aside{padding:16px;overflow:auto;background:#192335}.left{border-right:1px solid #354257}.right{border-left:1px solid #354257}h2{font-size:14px;margin:4px 0 14px;color:#c6d6f0}h3{font-size:13px;margin:22px 0 10px;color:#a9b9d0}
.viewport{position:relative;min-width:0}#canvas{width:100%;height:100%;display:block}#hint{position:absolute;bottom:14px;left:14px;background:#192335cc;padding:9px;border-radius:8px;color:#d1d9e7;pointer-events:none}
#tree{display:grid;gap:5px}#tree button{text-align:left;overflow-wrap:anywhere;font-size:12px;padding:8px}#tree button.selected{background:#2463e5}
.toolbar{display:flex;gap:5px;flex-wrap:wrap}.toolbar button{flex:1}label{display:block;color:#b7c4d8;margin:12px 0 5px}input[type=color],input[type=number]{width:100%;height:36px;background:#111c2d;color:white;border:1px solid #45546a;border-radius:7px;padding:5px}input[type=color]{padding:3px}input[type=file]{display:none}
.status{font-size:12px;color:#9fb0c8;line-height:1.6;margin-top:12px;white-space:pre-wrap}.danger{border-color:#a44b5c;color:#ffbdc5}button:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:850px){header{height:auto;min-height:60px;flex-wrap:wrap;padding:10px}.layout{height:auto;display:flex;flex-direction:column}.viewport{height:55vh;min-height:340px;order:0}.left{order:1}.right{order:2}aside{max-height:none}}
</style></head><body>
<header><strong>GLB Studio <span style="font-size:12px;color:#9baecb">試作版</span></strong><label class="file-label" for="file" style="margin:0">GLBを開く</label><input id="file" type="file" accept=".glb,.gltf,model/gltf-binary"><button id="demo">サンプル立方体</button><button id="undo">↶ 戻す</button><button id="redo">↷ やり直す</button><button id="save" class="primary">GLBを保存</button></header>
<div class="layout"><aside class="left"><h2>図形の追加</h2><div class="toolbar"><button data-add="box">立方体</button><button data-add="sphere">球体</button><button data-add="cylinder">円柱</button></div><button id="duplicate" style="width:100%;margin:12px 0">選択パーツを複製</button><h2>写真から立体レリーフ</h2>
<label class="file-label" for="photo" style="display:block;text-align:center;margin:8px 0">写真を選択</label><input id="photo" type="file" accept="image/png,image/jpeg,image/webp">
<label for="depth">凹凸の深さ <output id="depthValue">0.6</output></label><input id="depth" type="range" min="0.05" max="2" step="0.05" value="0.6" style="width:100%">
<label for="resolution">細かさ</label><select id="resolution" style="width:100%;padding:9px;background:#111c2d;color:white;border:1px solid #45546a;border-radius:7px"><option value="64">低（高速）</option><option value="128" selected>標準</option><option value="192">高（重め）</option></select>
<label for="invert"><input id="invert" type="checkbox"> 明暗を反転</label>
<button id="makeRelief" style="width:100%;margin:8px 0" disabled>レリーフを生成</button>
<p class="status">写真の明暗から凹凸を作る方式です。被写体の裏側を推測するAI立体化ではありません。</p>
<h2>パーツ一覧</h2><div id="tree"></div><p class="status">パーツ名をクリックするか、3D画面上のパーツをクリックして選択できます。</p></aside>
<main class="viewport"><canvas id="canvas"></canvas><div id="hint">左ドラッグ：回転　右ドラッグ：移動　ホイール：ズーム</div></main>
<aside class="right"><h2>パーツ編集</h2><div id="selected">未選択</div>
<h3>操作モード</h3><div class="toolbar"><button data-mode="translate">移動</button><button data-mode="rotate">回転</button><button data-mode="scale">拡縮</button></div>
<h3>材質</h3><label for="color">パーツの色</label><input id="color" type="color" value="#ffffff">
<h3>材質の詳細</h3><label for="roughness">粗さ</label><input id="roughness" type="range" min="0" max="1" step="0.05" value="1"><label for="metalness">金属感</label><input id="metalness" type="range" min="0" max="1" step="0.05" value="0"><label for="opacity">不透明度</label><input id="opacity" type="range" min="0.05" max="1" step="0.05" value="1"><h3>数値で調整</h3><div id="fields"></div>
<button id="remove" class="danger" style="margin-top:18px;width:100%">選択パーツを削除</button>
<button id="resetView" style="margin-top:8px;width:100%">カメラを初期化</button>
<div id="status" class="status" role="status">GLBファイルを読み込むか、サンプル立方体から始めてください。編集データはブラウザ内で処理されます。</div>
</aside></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {TransformControls} from "three/addons/controls/TransformControls.js";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {GLTFExporter} from "three/addons/exporters/GLTFExporter.js";
const $=id=>document.getElementById(id),canvas=$("canvas"),renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color("#273247");
const camera=new THREE.PerspectiveCamera(45,1,.01,1000);camera.position.set(3,2.5,5);
scene.add(new THREE.HemisphereLight(0xffffff,0x53617a,2));
const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,7,5);scene.add(light);
const grid=new THREE.GridHelper(12,24,0x66738c,0x405068);scene.add(grid);
const orbit=new OrbitControls(camera,canvas);orbit.enableDamping=true;
const transform=new TransformControls(camera,canvas);scene.add(transform.getHelper());transform.addEventListener("dragging-changed",e=>orbit.enabled=!e.value);
transform.addEventListener("objectChange",()=>{refreshFields();});
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
let root=new THREE.Group(),selected=null,mode="translate";root.name="Model";scene.add(root);
const status=t=>$("status").textContent=t;
const undoStack=[],redoStack=[];let restoring=false,dragStart=null;
function snapshot(){return root.clone(true)}
function checkpoint(){if(restoring)return;undoStack.push(snapshot());if(undoStack.length>30)undoStack.shift();redoStack.length=0;historyButtons()}
function historyButtons(){$("undo").disabled=!undoStack.length;$("redo").disabled=!redoStack.length}
function restore(state){restoring=true;select(null);scene.remove(root);root=state;scene.add(root);refreshTree();restoring=false;historyButtons()}
$("undo").onclick=()=>{if(!undoStack.length)return;redoStack.push(snapshot());restore(undoStack.pop());status("操作を元に戻しました。")};
$("redo").onclick=()=>{if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop());status("操作をやり直しました。")};
function resetHistory(){undoStack.length=0;redoStack.length=0;historyButtons()}
transform.addEventListener("mouseDown",()=>{dragStart=snapshot()});
transform.addEventListener("mouseUp",()=>{if(dragStart){undoStack.push(dragStart);if(undoStack.length>30)undoStack.shift();redoStack.length=0;dragStart=null;historyButtons();refreshFields()}});
function materialUpdate(fn){if(!selected)return;const mats=Array.isArray(selected.material)?selected.material:[selected.material];selected.material=Array.isArray(selected.material)?mats.map(m=>m.clone()):mats[0].clone();for(const m of (Array.isArray(selected.material)?selected.material:[selected.material])){fn(m);m.needsUpdate=true}}

function meshes(){const result=[];root.traverse(o=>{if(o.isMesh)result.push(o)});return result}
function refreshTree(){const list=$("tree");list.replaceChildren();for(const [i,m] of meshes().entries()){const b=document.createElement("button");b.textContent=(m.name||"Mesh "+(i+1));b.classList.toggle("selected",m===selected);b.onclick=()=>select(m);list.appendChild(b)}}
function refreshFields(){const panel=$("fields");panel.replaceChildren();if(!selected)return;for(const [prop,labels] of [["position",["X","Y","Z"]],["rotation",["X°","Y°","Z°"]],["scale",["X","Y","Z"]]]){const title=document.createElement("h3");title.textContent=prop==="position"?"位置":prop==="rotation"?"回転":"サイズ";panel.appendChild(title);labels.forEach((label,i)=>{const axes=["x","y","z"],axis=axes[i],l=document.createElement("label"),input=document.createElement("input");l.textContent=label;input.type="number";input.step="0.1";input.value=(prop==="rotation"?THREE.MathUtils.radToDeg(selected.rotation[axis]):selected[prop][axis]).toFixed(2);input.addEventListener("change",()=>{const v=Number(input.value);if(!Number.isFinite(v))return;checkpoint();if(prop==="rotation")selected.rotation[axis]=THREE.MathUtils.degToRad(v);else selected[prop][axis]=v;});panel.append(l,input)})}}
function select(mesh){selected=mesh;transform.detach();if(mesh)transform.attach(mesh);$("selected").textContent=mesh?(mesh.name||"名前なしパーツ"):"未選択";$("remove").disabled=!mesh;$("duplicate").disabled=!mesh;$("color").disabled=!mesh;if(mesh){const material=Array.isArray(mesh.material)?mesh.material[0]:mesh.material;if(material?.color)$("color").value="#"+material.color.getHexString();if(material){$("roughness").value=material.roughness??1;$("metalness").value=material.metalness??0;$("opacity").value=material.opacity??1}}refreshTree();refreshFields()}
function clear(){resetHistory();select(null);scene.remove(root);root=new THREE.Group();root.name="Model";scene.add(root)}
function frame(){const bounds=new THREE.Box3().setFromObject(root);if(bounds.isEmpty())return;const center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3()).length();orbit.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(size||3,(size||3)*.7,(size||3)*1.2));camera.near=Math.max(.001,size/1000);camera.far=Math.max(1000,size*20);camera.updateProjectionMatrix();orbit.update()}
$("demo").onclick=()=>{clear();const cube=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0x4b9cf3}));cube.name="Cube";root.add(cube);select(cube);frame();status("サンプルを読み込みました。パーツの移動・回転・色変更を試せます。")};
$("file").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;if(!file.name.toLowerCase().endsWith(".glb")){status("現在はGLB形式のみ対応しています。");return;}status("読み込み中…");try{const data=await file.arrayBuffer();const gltf=await new GLTFLoader().parseAsync(data,"");clear();root.add(gltf.scene);root.name=file.name;refreshTree();frame();status(file.name+" を読み込みました。外部参照テクスチャのあるファイルは表示できない場合があります。")}catch(err){status("読み込みに失敗しました: "+err.message)}});
document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{checkpoint();const kind=b.dataset.add;const geo=kind==="sphere"?new THREE.SphereGeometry(.6,24,16):kind==="cylinder"?new THREE.CylinderGeometry(.5,.5,1,24):new THREE.BoxGeometry(1,1,1);const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x69b4f9,roughness:.65}));m.name=kind==="sphere"?"Sphere":kind==="cylinder"?"Cylinder":"Cube";m.position.x=meshes().length*.25;root.add(m);select(m);status(m.name+" を追加しました。")});
$("duplicate").onclick=()=>{if(!selected)return;checkpoint();const copy=selected.clone(true);copy.name=(selected.name||"Mesh")+" Copy";copy.position.x+=.5;selected.parent.add(copy);select(copy);status("パーツを複製しました。")};
$("color").addEventListener("focus",()=>{if(selected)checkpoint()});
for(const prop of ["roughness","metalness","opacity"]){$(prop).addEventListener("pointerdown",()=>{if(selected)checkpoint()});$(prop).addEventListener("change",e=>{materialUpdate(m=>{if(prop==="opacity"){m.opacity=Number(e.target.value);m.transparent=m.opacity<1}else if(prop in m)m[prop]=Number(e.target.value)})})}
$("duplicate").disabled=true;
canvas.addEventListener("pointerup",e=>{if(e.button!==0||transform.dragging)return;const rect=canvas.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(meshes(),false);if(hits.length)select(hits[0].object)});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;transform.setMode(mode);document.querySelectorAll("[data-mode]").forEach(x=>x.style.background=x===b?"#2463e5":"")});document.querySelector('[data-mode="translate"]').click();
$("color").oninput=e=>materialUpdate(m=>{if(m.color)m.color.set(e.target.value)});
$("remove").onclick=()=>{if(!selected)return;checkpoint();const obj=selected;select(null);obj.parent?.remove(obj);refreshTree();status("選択パーツを削除しました。")};
$("resetView").onclick=frame;
$("save").onclick=async()=>{if(!meshes().length){status("保存するモデルがありません。");return;}status("GLBを書き出し中…");try{const data=await new GLTFExporter().parseAsync(root,{binary:true,onlyVisible:true});const blob=new Blob([data],{type:"model/gltf-binary"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="edited-model.glb";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);status("GLBを書き出しました。再読み込みして形状と材質を確認してください。")}catch(err){status("書き出しに失敗しました: "+err.message)}};

let photoFile=null;
$("photo").addEventListener("change",e=>{photoFile=e.target.files[0]||null;$("makeRelief").disabled=!photoFile;if(photoFile)status(photoFile.name+" を選択しました。深さを調整して生成してください。")});
$("depth").addEventListener("input",e=>$("depthValue").textContent=e.target.value);
$("makeRelief").onclick=async()=>{
 if(!photoFile)return;
 const btn=$("makeRelief");btn.disabled=true;status("写真から凹凸を生成中…");
 let bitmap;
 try{
  bitmap=await createImageBitmap(photoFile);
  const res=Number($("resolution").value),ratio=bitmap.width/bitmap.height;
  const w=ratio>=1?res:Math.max(8,Math.round(res*ratio));
  const h=ratio>=1?Math.max(8,Math.round(res/ratio)):res;
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const ctx=c.getContext("2d",{willReadFrequently:true});ctx.drawImage(bitmap,0,0,w,h);
  const pixels=ctx.getImageData(0,0,w,h).data;
  const maxSide=3,worldW=ratio>=1?maxSide:maxSide*ratio,worldH=ratio>=1?maxSide/ratio:maxSide;
  const depth=Number($("depth").value),invert=$("invert").checked;
  const heights=new Float32Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    const brightness=(pixels[i]*.2126+pixels[i+1]*.7152+pixels[i+2]*.0722)/255;
    heights[y*w+x]=(invert?1-brightness:brightness)*depth;
  }
  const verts=[],uvs=[],indices=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    verts.push((x/(w-1)-.5)*worldW,heights[y*w+x],(.5-y/(h-1))*worldH);
    uvs.push(x/(w-1),1-y/(h-1));
  }
  for(let y=0;y<h-1;y++)for(let x=0;x<w-1;x++){
    const a=y*w+x,b=a+1,c=a+w,d=c+1;
    indices.push(a,c,b,b,c,d);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));
  geo.setAttribute("uv",new THREE.Float32BufferAttribute(uvs,2));
  geo.setIndex(indices);geo.computeVertexNormals();
  const texture=new THREE.CanvasTexture(c);texture.colorSpace=THREE.SRGBColorSpace;
  texture.wrapS=texture.wrapT=THREE.ClampToEdgeWrapping;
  const material=new THREE.MeshStandardMaterial({map:texture,side:THREE.DoubleSide,roughness:1});
  const mesh=new THREE.Mesh(geo,material);mesh.name="Photo Relief";
  checkpoint();root.add(mesh);select(mesh);frame();
  status("レリーフを生成しました。3D画面で角度を変えて凹凸を確認できます。GLBとして保存可能です。");
 }catch(err){status("写真の読み込み・生成に失敗しました: "+err.message)}
 finally{if(bitmap)bitmap.close();btn.disabled=false}
};

const resize=()=>{const r=canvas.parentElement.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()};new ResizeObserver(resize).observe(canvas.parentElement);resize();
historyButtons();function tick(){requestAnimationFrame(tick);orbit.update();renderer.render(scene,camera)}tick();$("demo").click();
</script></body></html>
